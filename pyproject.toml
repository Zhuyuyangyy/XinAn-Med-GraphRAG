[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xinan-med-graphrag"
version = "0.1.0"
description = "新安医学古籍-现代病例GraphRAG知识平台"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "torch>=2.0.0",
    "scipy>=1.11.0",
    "networkx>=3.1",
]
